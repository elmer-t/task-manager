  /* ---- window shell ---- */
  .win {
    max-width: 1080px;
    margin: 0 auto;
    height: 720px;
    background: var(--layer-solid);
    border: 1px solid var(--stroke-strong);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .titlebar {
    height: 40px;
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 6px 0 14px;
    background: var(--layer);
    border-bottom: 1px solid var(--divider);

  }
  .titlebar .tb-icon {
    width: 16px; height: 16px; border-radius: 4px;
    background: linear-gradient(135deg, var(--accent-fill), var(--mem));

  .A-rail {

    display: flex; align-items: center; gap: 12px; height: 38px; padding: 0 12px;

  .navitem:hover { background: var(--hover); }
  .navitem.on { background: var(--accent-soft); font-weight: 600; }

  .navitem svg { width: 18px; height: 18px; color: var(--text-2); }
  .navitem .count { margin-left: auto; font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }

  .A-listwrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  .ctx hr { border: none; border-top: 1px solid var(--divider); margin: 4px 2px; }

  /* ---- toast ---- */
  .toast {

  /* ---- floating variant switcher ---- */
  .switcher {

  .switcher button:hover { background: rgba(255,255,255,0.14); }

  .hidden { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

  }
  var TINT = { blue:"#2f81f7", green:"#2da44e", orange:"#e8730c", purple:"#8250df", red:"#cf222e", teal:"#0b8f8f", slate:"#57606a", pink:"#bf3989" };
  var APPS = [
    P("Google Chrome","C",TINT.blue,"app",12.4,1840,{windows:["Gmail — Inbox","task-manager · GitHub","+ 6 more tabs"]}),
    P("Visual Studio Code","VS",TINT.blue,"app",6.1,912,{windows:["index.html — task-manager"]}),
    P("Spotify","S",TINT.green,"app",1.8,388,{}),
    P("Microsoft Word","W",TINT.blue,"app",0.4,276,{windows:["spec-v1.docx"]}),
    P("Windows Terminal","T",TINT.slate,"app",2.2,141,{}),
    P("Photos","P",TINT.orange,"app",0.0,88,{})
  ];
  var BG = [
    P("Antimalware Service Executable","",0,"bg",8.7,286),
    P("Windows Explorer","",0,"bg",1.1,204),
    P("Desktop Window Manager","",0,"bg",3.4,168),
    P("Runtime Broker","",0,"bg",0.2,42),
    P("Service Host: Network Service","",0,"bg",0.6,66),
    P("NVIDIA Container","",0,"bg",0.3,120),
    P("Search Indexer","",0,"bg",4.2,98),
    P("Print Spooler","",0,"bg",0.0,18),
    P("Cortana","",0,"bg",0.0,54),
    P("Steam Client Bootstrapper","",0,"bg",0.1,74)
  ];
  var SVC = [
    P("wuauserv","",0,"svc",0,0,{disp:"Windows Update",state:"Running"}),
    P("Spooler","",0,"svc",0,0,{disp:"Print Spooler",state:"Running"}),
    P("Dhcp","",0,"svc",0,0,{disp:"DHCP Client",state:"Running"}),
    P("WSearch","",0,"svc",0,0,{disp:"Windows Search",state:"Running"}),
    P("MSSQL$SQLEXPRESS","",0,"svc",0,0,{disp:"SQL Server (SQLEXPRESS)",state:"Stopped"}),
    P("Themes","",0,"svc",0,0,{disp:"Themes",state:"Running"}),
    P("W32Time","",0,"svc",0,0,{disp:"Windows Time",state:"Stopped"}),
    P("BITS","",0,"svc",0,0,{disp:"Background Intelligent Transfer",state:"Running"})
  ];
  var VIEWS = { apps:{label:"Apps", data:APPS}, background:{label:"Background processes", data:BG}, services:{label:"Services", data:SVC} };

  function heat(cpu){ return cpu >= 8 ? "heat-3" : cpu >= 3 ? "heat-2" : "heat-1"; }
  function memHeat(mem){ return mem >= 800 ? "heat-3" : mem >= 300 ? "heat-2" : "heat-1"; }
  function fmtMem(mb){ return mb >= 1024 ? (mb/1024).toFixed(1)+" GB" : Math.round(mb)+" MB"; }
  function icoFor(p){
    if (p.type === "app") return '<span class="ico" style="background:'+p.tint+'">'+p.mono+'</span>';
    if (p.type === "svc") return '<span class="ico svc">'+I.svc+'</span>';
    return '<span class="ico bg">'+I.bg+'</span>';
  }

  // ---------- live graph engine ----------
  var graphs = [];
  function makeGraph(canvas, kind, seedPct) {
    var pts = [];
    for (var i = 0; i < 60; i++) pts.push(seedPct + (Math.random()-.5)*8);
    var g = { canvas: canvas, kind: kind, pts: pts, cur: seedPct };
    graphs.push(g);
    return g;
  }
  function drawGraph(g) {
    var c = g.canvas, ctx = c.getContext("2d");
    var dpr = window.devicePixelRatio || 1;
    var w = c.clientWidth, h = c.clientHeight || 60;
    if (c.width !== w*dpr || c.height !== h*dpr) { c.width = w*dpr; c.height = h*dpr; }
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,w,h);
    var css = getComputedStyle(document.documentElement);
    var line = css.getPropertyValue(g.kind === "mem" ? "--mem" : "--cpu").trim();
    var fill = css.getPropertyValue(g.kind === "mem" ? "--mem-2" : "--cpu-2").trim();
    var grid = css.getPropertyValue("--divider").trim();
    // grid
    ctx.strokeStyle = grid; ctx.lineWidth = 1;
    for (var gy = 1; gy < 4; gy++){ var y = h*gy/4; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
    var n = g.pts.length, max = 100;
    function X(i){ return i/(n-1)*w; }
    function Y(v){ return h - (v/max)*(h-6) - 3; }
    // fill
    ctx.beginPath(); ctx.moveTo(0,h);
    for (var i=0;i<n;i++) ctx.lineTo(X(i), Y(g.pts[i]));
    ctx.lineTo(w,h); ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
    // line
    ctx.beginPath();
    for (i=0;i<n;i++){ var x=X(i), y=Y(g.pts[i]); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
    ctx.strokeStyle = line; ctx.lineWidth = 1.8; ctx.lineJoin="round"; ctx.stroke();
    // endpoint
    var ex = X(n-1), ey = Y(g.pts[n-1]);
    ctx.beginPath(); ctx.arc(ex,ey,3,0,7); ctx.fillStyle = line; ctx.fill();
    ctx.beginPath(); ctx.arc(ex,ey,6,0,7); ctx.strokeStyle = fill; ctx.lineWidth = 3; ctx.stroke();
  }
  var STATE = { cpu: 21, memGB: 12.4, memTotal: 32 };
  function tick() {
    STATE.cpu = Math.max(3, Math.min(96, STATE.cpu + (Math.random()-.5)*14));
    STATE.memGB = Math.max(8, Math.min(28, STATE.memGB + (Math.random()-.5)*0.5));
    graphs.forEach(function(g){
      if (!document.body.contains(g.canvas)) return;
      var v = g.kind === "mem" ? (STATE.memGB/STATE.memTotal*100) : STATE.cpu;
      g.pts.push(v + (Math.random()-.5)*3); if (g.pts.length>60) g.pts.shift();
      drawGraph(g);
    });
    document.querySelectorAll("[data-live=cpu]").forEach(function(e){ e.textContent = STATE.cpu.toFixed(0)+"%"; });
    document.querySelectorAll("[data-live=mem]").forEach(function(e){ e.textContent = STATE.memGB.toFixed(1)+" GB"; });
    document.querySelectorAll("[data-live=mempct]").forEach(function(e){ e.textContent = (STATE.memGB/STATE.memTotal*100).toFixed(0)+"%"; });
  }

  // ---------- selection + kill ----------
  var selected = null;
  function selectRow(el, p) {
    document.querySelectorAll(".row.sel").forEach(function(r){ r.classList.remove("sel"); });
    if (el) el.classList.add("sel");
    selected = p;
    document.querySelectorAll("[data-needs-sel]").forEach(function(b){ b.disabled = !p; });
    var dn = document.getElementById("dt-name");
    if (dn) renderDetail(p);
  }
  function killProc(p) {
    if (!p) return;
    [APPS,BG,BG].forEach(function(){});
    [ "apps","background","services" ].forEach(function(k){
      var arr = VIEWS[k].data, ix = arr.indexOf(p); if (ix>=0) arr.splice(ix,1);
    });
    hideCtx();
    render(current); // re-render active variant
    toast("Ended “"+(p.name)+"”");
    selected = null;
  }
  var toastT;
  function toast(msg){
    var t = document.getElementById("toast");
    t.innerHTML = '<span style="color:var(--danger)">'+I.kill+'</span>'+msg;
    t.classList.add("show"); clearTimeout(toastT);
    toastT = setTimeout(function(){ t.classList.remove("show"); }, 2200);
  }

  // ---------- context menu ----------
  function showCtx(x, y, p) {
    var c = document.getElementById("ctx");
    c.innerHTML =
      '<button data-act="detail">'+I.detail+' Go to details</button>'+
      '<button data-act="file">'+I.file+' Open file location</button>'+
      '<hr>'+
      '<button class="danger" data-act="kill">'+I.kill+' End task</button>';
    c.style.display = "block";
    var vw = window.innerWidth, vh = window.innerHeight, r = c.getBoundingClientRect();
    c.style.left = Math.min(x, vw - r.width - 8) + "px";
    c.style.top = Math.min(y, vh - r.height - 8) + "px";
    c.onclick = function(e){ var b = e.target.closest("button"); if(!b) return; if (b.dataset.act==="kill") killProc(p); else hideCtx(); };
  }
  function hideCtx(){ document.getElementById("ctx").style.display = "none"; }
  document.addEventListener("click", function(e){ if (!e.target.closest("#ctx")) hideCtx(); });
  document.addEventListener("scroll", hideCtx, true);

  function attachRow(el, p) {
    el.addEventListener("click", function(){ selectRow(el, p); });
    el.addEventListener("contextmenu", function(e){ e.preventDefault(); selectRow(el, p); showCtx(e.clientX, e.clientY, p); });
  }

  // ---------- column templates ----------
  function colTemplate(view) {
    if (view === "services") return "grid-template-columns: minmax(160px,2fr) 1.4fr 96px;";
    return "grid-template-columns: minmax(180px,2.4fr) 84px 108px;";
  }
  function headCells(view) {
    if (view === "services")
      return '<div>Name</div><div>Description</div><div style="text-align:right">Status</div>';
    return '<div>Name</div><div style="text-align:right">CPU</div><div style="text-align:right">Memory</div>';
  }
  function rowCells(p, view) {
    if (view === "services") {
      var running = p.state === "Running";
      return '<div class="cell name">'+icoFor(p)+'<span class="lbl">'+p.disp+'</span></div>'+
             '<div class="cell" style="color:var(--text-3)">'+p.name+'</div>'+
             '<div class="cell" style="text-align:right"><span class="pill '+(running?"run":"stop")+'">'+p.state+'</span></div>';
    }
    return '<div class="cell name">'+icoFor(p)+'<span class="lbl">'+p.name+'</span></div>'+
           '<div class="cell num '+heat(p.cpu)+'">'+p.cpu.toFixed(1)+'%</div>'+
           '<div class="cell num '+memHeat(p.mem)+'">'+fmtMem(p.mem)+'</div>';
  }
  function buildList(view, opts) {
    opts = opts || {};
    var wrap = document.createElement("div");
    wrap.className = "plist";
    wrap.style.flex = "1"; wrap.style.minHeight = "0";
    var head = document.createElement("div");
    head.className = "col-head"; head.setAttribute("style", colTemplate(view));
    head.innerHTML = headCells(view);
    var rows = document.createElement("div"); rows.className = "rows";
    VIEWS[view].data.forEach(function(p){
      var r = document.createElement("div");
      r.className = "row"; r.setAttribute("style", colTemplate(view));
      r.innerHTML = rowCells(p, view) + (opts.inlineKill && view!=="services" ? '<button class="kill-inline">End task</button>' : "");
      attachRow(r, p);
      if (opts.inlineKill) { var k = r.querySelector(".kill-inline"); if (k) k.addEventListener("click", function(e){ e.stopPropagation(); killProc(p); }); }
      rows.appendChild(r);
    });
    wrap.appendChild(head); wrap.appendChild(rows);
    return wrap;
  }

  // ---------- graph card html ----------
  function graphCard(kind) {
    var isMem = kind === "mem";
    return '<div class="graph">'+
      '<div class="g-top"><span class="dot" style="background:var(--'+(isMem?"mem":"cpu")+')"></span>'+
        '<span class="g-name">'+(isMem?"Memory":"CPU")+'</span>'+
        '<span class="g-val" data-live="'+(isMem?"mem":"cpu")+'">'+(isMem?"12.4 GB":"21%")+'</span></div>'+
      '<span class="g-sub">'+(isMem?"of 32 GB · <span data-live=mempct>39%</span> used":"12 cores · 3.8 GHz")+'</span>'+
      '<canvas data-graph="'+kind+'" height="72"></canvas></div>';
  }
  function wireGraphs(root, seedCpu, seedMem) {
    var cc = root.querySelector('[data-graph=cpu]'); if (cc) makeGraph(cc, "cpu", seedCpu||21);
    var mc = root.querySelector('[data-graph=mem]'); if (mc) makeGraph(mc, "mem", seedMem||39);
    requestAnimationFrame(function(){ graphs.forEach(drawGraph); });
  }

  // ---------- current view per variant ----------
  var curView = { A:"apps", B:"apps" };

  // ================= VARIANT A =================
  function renderA(stage) {
    var view = curView.A;
    var rail =
      '<div class="A-rail">'+
        Object.keys(VIEWS).map(function(k){
          var ic = k==="apps"?I.apps:k==="services"?I.svc:I.bg;
          return '<div class="navitem '+(k===view?"on":"")+'" data-view="'+k+'">'+ic+
            '<span>'+VIEWS[k].label+'</span><span class="count">'+VIEWS[k].data.length+'</span></div>';
        }).join("")+
      '</div>';
    var main =
      '<div class="A-main">'+
        '<div class="toolbar">'+
          '<div class="h1">'+VIEWS[view].label+'</div>'+
          '<div style="flex:1"></div>'+
          '<button class="btn danger" data-needs-sel disabled id="A-kill">'+I.kill+' End task</button>'+
        '</div>'+
        '<div class="A-strip">'+graphCard("cpu")+graphCard("mem")+'</div>'+
        '<div class="A-listwrap" id="A-list"></div>'+
      '</div>';
    stage.innerHTML = rail + main;
    stage.querySelector("#A-list").appendChild(buildList(view));
    stage.querySelectorAll(".navitem").forEach(function(n){
      n.addEventListener("click", function(){ curView.A = n.dataset.view; selected=null; render("A"); });
    });
    stage.querySelector("#A-kill").addEventListener("click", function(){ killProc(selected); });
    wireGraphs(stage, 21, 39);
  }

  // ================= VARIANT B =================
  function renderDetail(p) {
    var box = document.getElementById("B-detail");
    if (!box) return;
    if (!p) { box.innerHTML = '<div class="muted" style="text-align:center;padding:8px 0">Select a process to see details and actions.</div>'; return; }
    var rows = p.type==="svc"
      ? '<div class="k">Service</div><div class="v">'+p.name+'</div><div class="k">Status</div><div class="v">'+p.state+'</div>'
      : '<div class="k">CPU</div><div class="v">'+p.cpu.toFixed(1)+'%</div><div class="k">Memory</div><div class="v">'+fmtMem(p.mem)+'</div>'+
        '<div class="k">PID</div><div class="v">'+(4000+Math.floor(p.mem)%6000)+'</div><div class="k">Type</div><div class="v">'+(p.type==="app"?"App":"Background")+'</div>';
    box.innerHTML =
      '<div class="dt-name">'+icoFor(p)+(p.type==="svc"?p.disp:p.name)+'</div>'+
      '<div class="dt-grid">'+rows+'</div>'+
      (p.type==="svc" ? '<div class="muted">Services are view-only in v1.</div>'
        : '<button class="btn danger" id="B-kill" style="justify-content:center">'+I.kill+' End task</button>');
    var bk = document.getElementById("B-kill"); if (bk) bk.addEventListener("click", function(){ killProc(selected); });
  }
  function renderB(stage) {
    var view = curView.B;
    var pivot = '<div class="pivot">'+
      Object.keys(VIEWS).map(function(k){
        return '<div class="tab '+(k===view?"on":"")+'" data-view="'+k+'">'+VIEWS[k].label+'<span class="c">'+VIEWS[k].data.length+'</span></div>';
      }).join("")+'</div>';
    var main = '<div class="B-main">'+pivot+
      '<div class="toolbar"><div class="search">'+I.search+' Search '+VIEWS[view].label.toLowerCase()+'…</div></div>'+
      '<div id="B-list" style="flex:1;min-height:0;display:flex;flex-direction:column"></div></div>';
    var dock = '<div class="B-dock">'+graphCard("cpu")+graphCard("mem")+
      '<div class="detail" id="B-detail"></div></div>';
    stage.innerHTML = main + dock;
    stage.querySelector("#B-list").appendChild(buildList(view));
    stage.querySelectorAll(".tab").forEach(function(t){
      t.addEventListener("click", function(){ curView.B = t.dataset.view; selected=null; render("B"); });
    });
    renderDetail(null);
    wireGraphs(stage, 21, 39);
  }

  // ================= VARIANT C =================
  var collapsed = {};
  function renderC(stage) {
    var main = document.createElement("div"); main.className = "C-main";
    var scroll = document.createElement("div"); scroll.className = "rows"; scroll.style.flex="1";
    Object.keys(VIEWS).forEach(function(k){
      var v = VIEWS[k], isSvc = k==="services";
      var head = document.createElement("div"); head.className="grouphead";
      var totCpu = v.data.reduce(function(a,p){return a+(p.cpu||0);},0);
      var totMem = v.data.reduce(function(a,p){return a+(p.mem||0);},0);
      head.innerHTML = (I.chev)+
        '<span>'+v.label+'</span><span class="g-count">'+v.data.length+'</span>'+
        (isSvc ? '<span class="g-agg"><span>'+v.data.filter(function(p){return p.state==="Running";}).length+' running</span></span>'
               : '<span class="g-agg"><span>'+totCpu.toFixed(1)+'%</span><span>'+fmtMem(totMem)+'</span></span>');
      var chev = head.querySelector(".chev");
      if (collapsed[k]) chev.style.transform = "rotate(0deg)"; else chev.style.transform = "rotate(90deg)";
      head.addEventListener("click", function(){ collapsed[k] = !collapsed[k]; render("C"); });
      scroll.appendChild(head);
      if (!collapsed[k]) v.data.forEach(function(p){
        var r = document.createElement("div"); r.className="row"; r.setAttribute("style", colTemplate(k));
        r.innerHTML = rowCells(p,k) + (!isSvc ? '<button class="kill-inline">End task</button>' : "");
        attachRow(r, p);
        var kb = r.querySelector(".kill-inline"); if (kb) kb.addEventListener("click", function(e){ e.stopPropagation(); killProc(p); });
        scroll.appendChild(r);
      });
    });
    main.appendChild(scroll);
    var bottom = document.createElement("div"); bottom.className = "C-bottom";
    bottom.innerHTML =
      '<div class="C-meter"><div class="m-txt"><span class="m-lbl">CPU</span><span class="m-val" data-live="cpu">21%</span></div><canvas data-graph="cpu"></canvas></div>'+
      '<div class="C-meter"><div class="m-txt"><span class="m-lbl">Memory</span><span class="m-val" data-live="mem">12.4 GB</span></div><canvas data-graph="mem"></canvas></div>';
    main.appendChild(bottom);
    stage.appendChild(main);
    wireGraphs(stage, 21, 39);
  }

  // ---------- render dispatch ----------
  var current = "A";
  var META = { A:"Rail + top graphs", B:"Top tabs + right dock", C:"Grouped list + bottom bar" };
  function render(which) {
    current = which;
    graphs = [];
    var stage = document.getElementById("stage");
    stage.innerHTML = "";
    if (which === "A") renderA(stage);
    else if (which === "B") renderB(stage);
    else renderC(stage);
    document.querySelectorAll("[data-needs-sel]").forEach(function(b){ b.disabled = true; });
    document.getElementById("swlbl").innerHTML = "<b>"+which+"</b>"+META[which];
    var u = new URL(window.location.href); u.searchParams.set("variant", which);
    try { history.replaceState(null, "", u); } catch(e){}
  }

  // ---------- switcher ----------
  var ORDER = ["A","B","C"];
  function cycle(dir){ var i = ORDER.indexOf(current); i = (i + dir + 3) % 3; render(ORDER[i]); }
  document.getElementById("prev").addEventListener("click", function(){ cycle(-1); });
  document.getElementById("next").addEventListener("click", function(){ cycle(1); });
  document.addEventListener("keydown", function(e){
    var t = e.target; if (t && (t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.isContentEditable)) return;
    if (e.key === "ArrowLeft") cycle(-1);
    else if (e.key === "ArrowRight") cycle(1);
  });

  // ---------- boot ----------
  var start = (new URL(window.location.href)).searchParams.get("variant");
  render(ORDER.indexOf(start) >= 0 ? start : "A");
  setInterval(tick, 1000);
  window.addEventListener("resize", function(){ graphs.forEach(drawGraph); });
})();
</script>
